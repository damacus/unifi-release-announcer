version: '3'
tasks:
  default:
    cmds: [task --list]
  install:
    desc: Fetch locked Rust dependencies
    cmds: [cargo fetch --locked]
  dev-install:
    desc: Install Rust and Python compatibility dependencies
    cmds: [cargo fetch --locked, uv sync --extra dev]
  test:
    desc: Run Rust tests
    cmds: [cargo test --locked]
  test-python:
    desc: Run preserved Python reference tests
    cmds: [uv run --extra dev python -m unittest discover -s tests -p "test_*.py"]
  parity:
    desc: Regenerate synthetic Python reference fixtures
    cmds: [uv run --extra dev python scripts/generate_parity.py]
  lint:
    cmds: [cargo clippy --locked --all-targets -- -D warnings]
  format:
    cmds: [cargo fmt --all]
  check:
    cmds: [cargo fmt --all --check, task lint, task test, task test-python]
  ci:
    cmds: [task check]
  run:
    cmds: [cargo run --locked --release --]
  dry-run:
    cmds: [cargo run --locked --release -- --once --dry-run]
  build:
    cmds: [docker compose build announcer]
  docker-run:
    cmds: [docker compose up announcer]
  docs-build:
    cmds: [uv run --extra dev mkdocs build --strict]
  docs-serve:
    cmds: [uv run --extra dev mkdocs serve]
