[project]
site_name = "UniFi Release Announcer"
site_description = "HTTP-only UniFi release announcements for Discord."
site_author = "Dan Webb"
site_url = "https://damacus.github.io/unifi-release-announcer/"
repo_url = "https://github.com/damacus/unifi-release-announcer"
repo_name = "damacus/unifi-release-announcer"
nav = [
  { "Home" = "index.md" },
  { "Quick Start" = "quickstart.md" },
  { "Installation" = "installation.md" },
  { "Configuration" = "configuration.md" },
  { "Deployment" = "deployment.md" },
  { "Advanced Usage" = "advanced.md" },
  { "API Reference" = "api.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
features = ["navigation.tabs", "navigation.sections", "navigation.expand", "content.code.copy"]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"
