services:
  announcer:
    build: .
    env_file: [.env]
    environment:
      TAGS: "${TAGS:-unifi-protect,unifi-network}"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes: [".:/app"]
    command: ["sleep", "infinity"]
