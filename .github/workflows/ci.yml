name: CI/CD

on:
  workflow_call:
    inputs:
      ref:
        description: Exact release tag to validate
        type: string
        default: ""
      skip-publish:
        description: Run acceptance checks without publishing a branch image
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust and captured compatibility fixtures
        run: cargo test --locked --all-targets
      - name: Build release binaries
        run: cargo build --release --locked --bins

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: jdx/mise-action@v5
        with:
          install_args: uv

      - name: Build documentation
        run: uv run --locked --python 3.14 zensical build

      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.13.2 validate migrate-announcer-to-rust --strict

  build-check:
    strategy:
      matrix:
        arch: [amd64, arm64]
    needs: [test, rust-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: announcer:ci
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify scratch image execution and size
        run: |
          docker run --rm --read-only --cap-drop=ALL announcer:ci --version
          docker run --rm --read-only --cap-drop=ALL --entrypoint /usr/local/bin/release-parser announcer:ci --help
          size=$(docker image inspect --format '{{.Size}}' announcer:ci)
          echo "Runtime image: $size bytes"
          test "$size" -le 33554432

  # Keep the existing required check name, and run it on PRs as well.
  build-and-push:
    if: ${{ always() }}
    needs: [test, rust-test, build-check]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all acceptance checks passed
        env:
          REFERENCE_RESULT: ${{ needs.test.result }}
          RUST_RESULT: ${{ needs.rust-test.result }}
          IMAGES_RESULT: ${{ needs.build-check.result }}
        run: |
          test "$REFERENCE_RESULT" = success
          test "$RUST_RESULT" = success
          test "$IMAGES_RESULT" = success
          echo "Rust tests, compatibility checks and both scratch images passed"

  publish-image:
    if: github.event_name == 'push' && !inputs.skip-publish
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
